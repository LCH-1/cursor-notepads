name: Publish NGINX Beautifier Once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-open-vsx:
    name: Publish NGINX Beautifier to Open VSX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: LCH-1/nginx-beautifier
          ref: v0.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Publish to Open VSX
        run: npx ovsx publish nginx-beautifier-0.2.1.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
